[package]
name = "chengsuan"
version = "1.1.0"
description = "澄算便携成本计算工具"
edition = "2021"

[lib]
name = "chengsuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ChengSuan"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
fs2 = "0.4"
rfd = "0.15"
arboard = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
encoding_rs = "0.8"
bigdecimal = "0.4"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "unwind"
